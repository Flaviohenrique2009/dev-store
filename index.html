<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">

</head>


<body>
    <header class="site-header">
        <div class="header-container__main-line">
            <a class="header-container__logo" href="index.html">
                <!-- <img class="header-container__logo-image" src="./assets/images/logo nexus.jfif" alt="DevStore"> -->
            </a>

            <nav class="main-nav" aria-label="Navegação principal">
                <ul class="main-nav__list">
                    <li class="main-nav__item">Catálogo</li>
                    <li class="main-nav__item">Cupons</li>
                    <li class="main-nav__item">Ofertas</li>
                    <li class="main-nav__item">Moda</li>
                    <li class="main-nav__item">Vender</li>
                </ul>
            </nav>

            <form class="header-search" role="search">
                <label class="header-search__label" for="search-input"></label>
                <input class="header-search__input" id="search-input" type="text">
                <button class="header-search__button" type="button">Buscar</button>
            </form>

            <div class="header-actions">
                <a class="header-actions__link" href="#"></a>
            </div>

            <div class="nav-icon">
                <nav class="header-icons" aria-label="Ícones de navegação">
                    <ul class="header-icons__list">
                        <li class="header-icons__item">
                            <img src="./assets/images/notificacao (1).png" alt="Notificações">
                        </li>
                        <li class="header-icons__item">
                            <img src="./assets/images/botao-play.png" alt="Vídeos">
                        </li>
                        <li class="header-icons__item">
                            <img src="./assets/images/favorito.png" alt="Favoritos">
                        </li>
                        <li class="header-icons__item">
                            <img src="./assets/images/carrinho-de-compras.png" alt="Carrinho">
                        </li>
                    </ul>
                </nav>
            </div>



            
        </div>
    </header>
</body>

</html>
